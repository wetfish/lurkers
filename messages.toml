# What lurker says in its rooms. lurker is built with this file, so a change
# here takes effect when lurker is rebuilt and deployed.
#
# Each room has three lists:
#
# - ping: one is sent to each lurker about once a week. Each lurker hears
#   every ping they have the data for before any one repeats.
# - welcome: one is sent when a lurker first joins their room.
# - fanfare: one is sent when a lurker speaks, at most once a day.
# - warning: sent once, in a channel lurker can kick from, to say the lurker
#   will be kicked to their room after their grace period.
# - kick: the reason given when lurker kicks a lurker from a channel.
#
# Placeholders in braces are filled in for the lurker. A message is only used
# when everything it needs is recorded about them, so lurkers without notes
# only get the messages that need none. Times are in days unless a unit is
# named after a colon, as in {idle:seconds}; {idle:silly} picks a unit at
# random. docs/messages.md lists the placeholders and units.

